<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening YouTube Downloader</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-dark: #09090b;
        --bg-darker: #111114;
        --border-dark: rgba(255, 255, 255, 0.14);
        --text-primary: #fafafa;
        --text-subtle: #b8b8c0;
        --brand-accent: #ff2d55;
        --brand-accent-2: #ff5a36;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 18px;
        background: linear-gradient(180deg, #151518 0%, var(--bg-dark) 66%);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      .panel {
        width: 100%;
        max-width: 330px;
        padding: 18px;
        border: 1px solid var(--border-dark);
        border-radius: 10px;
        background: rgba(17, 17, 20, 0.92);
      }

      .mark {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--brand-accent), var(--brand-accent-2));
        font-weight: 900;
        font-size: 13px;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0 0 7px 0;
        font-size: 18px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--text-subtle);
        font-size: 13px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="mark">SERP</div>
      <h1>Opening downloader...</h1>
      <p>Keep this sidebar open while activation finishes.</p>
    </main>
  </body>
</html>
